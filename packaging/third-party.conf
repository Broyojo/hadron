# What Hadron.app carries from other projects:
#   name | what it is | licence | licence files | their directory | source
# scripts/package-runtime.sh copies the files into the runtime's licenses/ directory and writes
# THIRD-PARTY-NOTICES.md from this list. The name is the one in sources.conf, which gives the
# source and the directory src/<name>; the last two fields are for what is not in sources.conf.
wine|Wine, the Windows API|LGPL-2.1-or-later|COPYING.LIB LICENSE NOTICES.md
fex|FEX, the x86 emulator|MIT|LICENSE
dxmt|DXMT, Direct3D 10 and 11 on Metal|LGPL-2.1-or-later|COPYING.LIB LICENSE
llvm15|LLVM 15, linked into DXMT's shader compiler|Apache-2.0 with LLVM exceptions|LICENSE.TXT|toolchains/llvm15|https://github.com/llvm/llvm-project.git at `llvmorg-15.0.7`
mtld3d|mtld3d, Direct3D 9 on Metal|zlib|LICENSE
mesa|Mesa: KosmicKrisp (Vulkan on Metal) and Zink (OpenGL on Vulkan)|MIT, and the others in its licenses directory|licenses
vkd3d-proton|vkd3d-proton, Direct3D 12 on Vulkan|LGPL-2.1-or-later|COPYING LICENSE
dxvk|DXVK's DXGI|zlib|LICENSE
ffmpeg|FFmpeg, decoding only|LGPL-2.1-or-later|COPYING.LGPLv2.1 LICENSE.md
notproton|NotProton: the Steam client library (GPL-3.0), with the Steam bridge lsteamclient (Steamworks SDK licence), Dobby (Apache-2.0) and cJSON (MIT)|GPL-3.0, Steamworks SDK licence, BSD-3-Clause, Apache-2.0, MIT|LICENSE LICENSE.lsteamclient LICENSE.steam-shim NOTICE vendor/dobby/LICENSE vendor/cJSON.h
